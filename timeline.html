<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>188 Days — Sage & Lavender</title>
  <style>
    :root{
      --track-height: 12px;
      --pin-size: 14px;
      --pin-gap: 6px;
      --primary: #88B08A;
      --primary-strong: #6E8F6E;
      --pin-color: #C9A3FF;      /* base lavender */
      --pin-stem: #4E3B63;
      --bg: #071428;
      --muted-text: rgba(255,255,255,0.82);
      --accent: #BEE7C7;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--muted-text); -webkit-font-smoothing:antialiased; }
    .wrap{ height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
    .panel{ width:100%; height:100%; max-width:1200px; border-radius:12px; padding:20px; box-sizing:border-box; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); backdrop-filter: blur(6px); box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02); display:flex; flex-direction:column; gap:12px; }

    header { display:flex; flex-direction:column; gap:4px; color:var(--muted-text); }
    h2 { margin:0; font-weight:700; color:#EAF6EF; font-size:22px; }

    .timeline { position:relative; flex:1; min-height:380px; border-radius:10px; padding:18px 18px 28px 18px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; }
    .track { position:relative; height:var(--track-height); background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:999px; margin:16px 0 12px; overflow:visible; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 4px 18px rgba(0,0,0,0.6); }
    .track .progress { position:absolute; left:0; top:0; bottom:0; width:0%; background: linear-gradient(90deg, var(--primary), var(--primary-strong)); border-radius:999px; transition: width 120ms linear; z-index:2; box-shadow: 0 8px 24px rgba(110,143,110,0.14); }
    .track .pins { position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; z-index:4; }

    .indicator { position:absolute; top: calc(-1 * (var(--track-height) / 2 + 18px)); transform:translateX(-50%); width:3px; height: calc(var(--track-height) + 36px); background: linear-gradient(180deg,var(--primary),var(--primary-strong)); border-radius:3px; z-index:9; cursor: ew-resize; box-shadow: 0 8px 30px rgba(110,143,110,0.18); user-select: none; touch-action: pan-x; }
    .indicator .date { position:absolute; top:-44px; left:50%; transform:translateX(-50%); background: rgba(6,10,20,0.85); color: #EAF6EF; padding:8px 12px; border-radius:8px; font-size:13px; box-shadow:0 8px 20px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.03); white-space:nowrap; text-align:center; min-width:140px; pointer-events:none; }
    .indicator .sub { display:block; margin-top:6px; font-size:12px; color:var(--accent); }

    .pin { position:absolute; bottom: calc(100% + var(--pin-gap)); width:var(--pin-size); height:var(--pin-size); border-radius:50%; background: var(--pin-color); border:2px solid rgba(255,255,255,0.06); transform:translateX(-50%); box-shadow:0 8px 20px rgba(100,70,160,0.18); cursor:pointer; pointer-events:auto; z-index:6; }
    .pin::after{ content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); width:2px; height:var(--pin-gap); background:var(--pin-stem); border-radius:1px; z-index:6; }
    .pin .label { display:none; position:absolute; bottom: calc(100% + var(--pin-gap) + 4px); left:50%; transform:translateX(-50%); background: rgba(6,10,20,0.85); color:#EAF6EF; padding:8px 10px; border-radius:8px; font-size:13px; white-space:nowrap; box-shadow:0 8px 22px rgba(0,0,0,0.6); z-index:12; border:1px solid rgba(255,255,255,0.02); }
    .pin:hover .label, .pin.show .label { display:block; }

    .controls { display:flex; gap:12px; align-items:center; margin-top:6px; flex-wrap:wrap; }
    .btn{ background:var(--primary); color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow: 0 8px 20px rgba(110,143,110,0.14); }
    .small{ font-size:14px; } label.meta { color:var(--muted-text); display:flex; gap:8px; align-items:center; }

    .settings { display:flex; gap:12px; align-items:center; background: rgba(255,255,255,0.01); padding:8px; border-radius:10px; border:1px solid rgba(255,255,255,0.02); }
    .settings label { font-size:13px; color:var(--muted-text); display:flex; gap:8px; align-items:center; }
    .settings input[type="color"] { width:40px; height:32px; padding:3px; border-radius:6px; border:none; cursor:pointer; }

    @media (max-width:900px){ .panel{ padding:14px; } .timeline{ min-height:420px; } .indicator { height: calc(var(--track-height) + 58px); } }
    @media (max-width:560px){ .timeline{ min-height:520px; padding:18px; } .controls{ gap:8px; } .btn{ padding:8px 10px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel" role="main">
      <header>
        <h2>188 Days</h2>
      </header>

      <div class="timeline" id="timeline">
        <div class="track" id="track">
          <div class="progress" id="progress"></div>
          <div class="pins" id="pins"></div>

          <div class="indicator" id="indicator" style="left:0%;">
            <div class="date" id="indicator-date">—<span class="sub" id="indicator-sub"></span></div>
          </div>
        </div>
      </div>

      <div class="controls" style="align-items:center;">
        <button class="btn" id="playPause">Play</button>

        <label class="meta small" style="align-items:center">
          <input type="checkbox" id="trackToday" style="margin-right:8px"/> Track today
        </label>

        <div class="meta small" style="align-items:center">
          Speed:
          <input type="range" id="speed" min="0.1" max="6" value="1" step="0.1" style="vertical-align:middle; margin-left:8px"/>
          <span id="speedVal" style="margin-left:6px; color:var(--accent)">1×</span>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; gap:12px; align-items:center;">
        <div class="settings" role="region" aria-label="Pin settings">
          <label>Pin color: <input type="color" id="pinColor" value="#C9A3FF" title="Pin color (lavender)"/></label>
          <label>Stem color: <input type="color" id="stemColor" value="#4E3B63" title="Stem color (muted purple)"/></label>
        </div>
      </div>
    </div>
  </div>

<script>
/* PINS - edit only this array to change pins. Strings use double quotes to avoid quote mismatches. */
const pinsData = [
  { "date": "2026-07-04", "title": "The day you left" },
  { "date": "2026-08-08", "title": "1 month, and first I love you" },
  { "date": "2026-08-16", "title": "Started a new life in Spain" },
  { "date": "2026-08-20", "title": "1/4th, my love" },
  { "date": "2026-09-05", "title": "1/3rd, mmm just 2 more of what we just did and its so easy" },
  { "date": "2026-09-08", "title": "2 months, and I get to have you during school" },
  { "date": "2026-10-06", "title": "Halfway!" },
  { "date": "2026-10-08", "title": "3 months, i love you mwah" },
  { "date": "2026-11-07", "title": "2/3rd, just one more third my love (:\'" },
  { "date": "2026-11-08", "title": "4 months, mmm my wife" },
  { "date": "2026-11-22", "title": "3/4th, homestretch!" },
  { "date": "2026-12-08", "title": "5 months, last anniversary before i get you back" },
  { "date": "2027-01-08", "title": "Welcome back (:" }
];

const START = new Date("2026-07-04T00:00:00Z");
const END   = new Date("2027-01-08T23:59:59Z");
const totalMs = END - START;

/* DOM refs */
const trackEl = document.getElementById("track");
const pinsEl = document.getElementById("pins");
const indicator = document.getElementById("indicator");
const indicatorDate = document.getElementById("indicator-date");
const indicatorSub = document.getElementById("indicator-sub");
const playPauseBtn = document.getElementById("playPause");
const speedInput = document.getElementById("speed");
const speedVal = document.getElementById("speedVal");
const trackTodayCheckbox = document.getElementById("trackToday");
const progressEl = document.getElementById("progress");
const pinColorInput = document.getElementById("pinColor");
const stemColorInput = document.getElementById("stemColor");

/* Keep a snapshot of initial pins so we can tell which pins are added after load */
const initialPinSet = new Set(pinsData.map(p => `${p.date}||${p.title}`));

/* Helper: lighten a hex color by a percent (0..100) */
function lightenHex(hex, percent){
  hex = hex.replace("#","").trim();
  if (hex.length === 3) hex = hex.split("").map(c => c+c).join("");
  const num = parseInt(hex,16);
  let r = (num >> 16) & 0xff;
  let g = (num >> 8) & 0xff;
  let b = num & 0xff;
  const amt = Math.round(255 * (percent/100));
  r = Math.min(255, Math.round(r + amt));
  g = Math.min(255, Math.round(g + amt));
  b = Math.min(255, Math.round(b + amt));
  const out = ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
  return `#${out}`;
}

function dateToPercent(d){
  const t = (new Date(d) - START) / totalMs;
  return Math.min(100, Math.max(0, t * 100));
}
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* Compute current base and lighter color */
function getPinColors(){
  const base = getComputedStyle(document.documentElement).getPropertyValue("--pin-color").trim() || "#C9A3FF";
  const lighter = lightenHex(base, 14); // 14% lighter
  return { base, lighter };
}

function renderPins(){
  pinsEl.innerHTML = "";
  const { base, lighter } = getPinColors();
  pinsData.forEach((p) => {
    const key = `${p.date}||${p.title}`;
    const isNew = !initialPinSet.has(key);
    const color = isNew ? lighter : base;
    const percent = dateToPercent(p.date);
    const el = document.createElement("div");
    el.className = "pin";
    el.style.left = percent + "%";
    el.title = (p.title || "") + " — " + p.date;
    el.style.background = color;
    el.innerHTML = `<div class="label"><strong>${escapeHtml(p.title)}</strong><div style="font-size:12px;color:rgba(255,255,255,0.8)">${p.date}</div></div>`;
    el.addEventListener("click", () => el.classList.toggle("show"));
    el.addEventListener("mouseenter", ()=> el.classList.add("show"));
    el.addEventListener("mouseleave", ()=> el.classList.remove("show"));
    pinsEl.appendChild(el);
  });
}

function updateProgressAndIndicatorFromMs(msFromStart){
  const pct = (msFromStart / totalMs) * 100;
  const clampedPct = Math.min(100, Math.max(0, pct));
  progressEl.style.width = clampedPct + "%";
  indicator.style.left = clampedPct + "%";
  const curDate = new Date(START.getTime() + msFromStart);
  indicatorDate.childNodes[0].nodeValue = curDate.toISOString().slice(0,10);
}

let playing = false;
let playSpeed = parseFloat(speedInput.value) || 1;
let currentMs = 0;
let lastRAF = null;
let trackInterval = null;
let tracking = false;

function nowMsFromStart(){ return Date.now() - START.getTime(); }

function getNowInEasternISO(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false
  }).formatToParts(now).reduce((acc, p) => { if (p.type !== "literal") acc[p.type] = p.value; return acc; }, {});
  if (!parts.year) return "";
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second} ET`;
}

function enableControlsForTracking(enabled){ playPauseBtn.disabled = enabled; speedInput.disabled = enabled; }

function startTracking(){
  if (tracking) return;
  tracking = true;
  trackTodayCheckbox.checked = true;
  enableControlsForTracking(true);
  const ms = nowMsFromStart();
  currentMs = Math.min(Math.max(0, ms), totalMs);
  updateProgressAndIndicatorFromMs(currentMs);
  updateLabelForTracking();
  trackInterval = setInterval(()=> {
    const nowMs = nowMsFromStart();
    currentMs = Math.min(Math.max(0, nowMs), totalMs);
    updateProgressAndIndicatorFromMs(currentMs);
    updateLabelForTracking();
  }, 250);
}
function stopTracking(){
  if (!tracking) return;
  tracking = false;
  trackTodayCheckbox.checked = false;
  enableControlsForTracking(false);
  if (trackInterval){ clearInterval(trackInterval); trackInterval = null; }
  indicatorSub.textContent = "";
  updateProgressAndIndicatorFromMs(currentMs);
}
function updateLabelForTracking(){
  const nowEpoch = Date.now();
  const msFromStart = nowEpoch - START.getTime();
  const clampedMs = Math.min(Math.max(0, msFromStart), totalMs);
  const frac = clampedMs / totalMs;
  const percent = (frac * 100);
  const pctStr = percent.toFixed(3) + "%";
  const etStr = getNowInEasternISO();
  indicatorDate.childNodes[0].nodeValue = etStr;
  indicatorSub.textContent = pctStr;
}

function play(){ if (playing) return; if (tracking) return; playing = true; playPauseBtn.textContent = "Pause"; lastRAF = performance.now(); requestAnimationFrame(rafStep); }
function pause(){ playing = false; playPauseBtn.textContent = "Play"; }
function rafStep(ts){ if (!playing) return; const dt = ts - lastRAF; lastRAF = ts; const baseDurationMs = 60000; const deltaMs = dt * (totalMs / baseDurationMs) * playSpeed; currentMs += deltaMs; if (currentMs > totalMs) { currentMs = totalMs; updateProgressAndIndicatorFromMs(currentMs); pause(); return; } updateProgressAndIndicatorFromMs(currentMs); requestAnimationFrame(rafStep); }

playPauseBtn.addEventListener("click", ()=>{ if (tracking) return; if (playing) pause(); else play(); });
speedInput.addEventListener("input", ()=>{ playSpeed = parseFloat(speedInput.value); speedVal.textContent = playSpeed.toFixed(1) + "×"; });

let isDragging = false;
function pointerPositionToMs(clientX){
  const rect = trackEl.getBoundingClientRect();
  const x = clientX - rect.left;
  const pct = Math.min(1, Math.max(0, x / rect.width));
  return pct * totalMs;
}
function pointerPositionToPct(clientX){
  const rect = trackEl.getBoundingClientRect();
  const x = clientX - rect.left;
  return Math.min(1, Math.max(0, x / rect.width));
}

function startDrag(ev){
  if (tracking) stopTracking();
  isDragging = true;
  playPauseBtn.disabled = true;
  if (ev.target.setPointerCapture) { try { ev.target.setPointerCapture(ev.pointerId); } catch(e){} }
  const ms = pointerPositionToMs(ev.clientX);
  currentMs = ms;
  updateProgressAndIndicatorFromMs(currentMs);
  const pct = pointerPositionToPct(ev.clientX);
  indicatorSub.textContent = (pct*100).toFixed(3) + "%";
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  ev.preventDefault();
}
function onDragMove(ev){
  if (!isDragging) return;
  const ms = pointerPositionToMs(ev.clientX);
  currentMs = ms;
  updateProgressAndIndicatorFromMs(currentMs);
  const pct = pointerPositionToPct(ev.clientX);
  indicatorSub.textContent = (pct*100).toFixed(3) + "%";
}
function endDrag(ev){
  if (!isDragging) return;
  isDragging = false;
  playPauseBtn.disabled = false;
  if (ev && ev.target && ev.target.releasePointerCapture) { try { ev.target.releasePointerCapture(ev.pointerId); } catch(e){} }
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  setTimeout(()=> { if (!tracking) indicatorSub.textContent = ""; }, 1000);
}

indicator.addEventListener("pointerdown", startDrag);
trackEl.addEventListener("pointerdown", (ev) => { startDrag(ev); });
trackTodayCheckbox.addEventListener("change", (e)=>{ if (trackTodayCheckbox.checked){ pause(); startTracking(); } else { stopTracking(); } });

function applyPinColor(color){ document.documentElement.style.setProperty("--pin-color", color); renderPins(); }
function applyStemColor(color){ document.documentElement.style.setProperty("--pin-stem", color); }
pinColorInput.addEventListener("input", (e)=> applyPinColor(e.target.value));
stemColorInput.addEventListener("input", (e)=> applyStemColor(e.target.value));

/* Programmatic API to add pins at runtime (these will appear in lighter color) */
window.timelineAPI = {
  addPin(pin){ // pin: {date: 'YYYY-MM-DD', title:'...'}
    if (!pin || !pin.date || !pin.title) throw new Error("addPin requires {date, title}");
    pinsData.push({ date: pin.date, title: pin.title });
    renderPins();
  },
  getPins(){ return pinsData.slice(); },
  setTimeTo(dateStr){ const ms = new Date(dateStr + "T00:00:00Z") - START; currentMs = Math.min(Math.max(0, ms), totalMs); updateProgressAndIndicatorFromMs(currentMs); },
  play(){ if (!tracking) play(); },
  pause(){ pause(); }
};

/* Init render */
function init(){ renderPins(); currentMs = 0; updateProgressAndIndicatorFromMs(currentMs); speedVal.textContent = playSpeed.toFixed(1) + "×"; applyPinColor(pinColorInput.value); applyStemColor(stemColorInput.value); }
init();
</script>
</body>
</html>
